[project]
name = "vidgen"
version = "0.1.0"
description = "TikTok video generation pipeline"
requires-python = ">=3.13.13"
dependencies = [
    "vieneu",
    "numpy",
    "librosa",
    "soundfile",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]
video-audit = ["opencv-python", "stable-ts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vidgen"]
