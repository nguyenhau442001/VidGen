[project]
name = "vidgen"
version = "0.1.0"
description = "TikTok video generation pipeline"
requires-python = ">=3.13.13"
dependencies = [
    "vieneu",
    "numpy",
    "librosa",
    "soundfile",
    "requests",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=43,<46",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest"]
video-audit = ["opencv-python", "stable-ts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool/vidgen"]

[tool.pytest.ini_options]
pythonpath = ["tool"]
testpaths = ["tool/tests"]
